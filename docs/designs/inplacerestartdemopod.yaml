# Demo Pod for Kubernetes 1.35+ In-Place Restart (Restart All Containers).
# Requires: RestartAllContainersOnContainerExits + NodeDeclaredFeatures enabled on API server and kubelet.
apiVersion: v1
kind: Pod
metadata:
  name: inplace-restart-demo
  labels:
    app: inplace-restart-demo
spec:
  restartPolicy: Always
  volumes:
  - name: shared
    emptyDir: {}
  initContainers:
  - name: setup
    image: busybox:1.36
    command: ["sh", "-c", "echo init-done > /shared/init-done; echo 'Init finished at' $(date); exit 0"]
    volumeMounts:
    - name: shared
      mountPath: /shared
  containers:
  - name: main-app
    image: nginx:1.25
    ports:
    - containerPort: 80
  - name: restart-trigger
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      while true; do
        [ -f /shared/restart-requested ] && rm -f /shared/restart-requested && exit 88
        sleep 2
      done
    volumeMounts:
    - name: shared
      mountPath: /shared
    restartPolicy: Always
    restartPolicyRules:
    - action: RestartAllContainers
      exitCodes:
        operator: In
        values: [88]
